name: Mirror feeds

# Fetch the feeds in mirror.json (sites that block the Cloudflare proxy) and
# publish them to the `mirror` branch, which the page reads through
# raw.githubusercontent.com. The branch is force-pushed with a single commit,
# so it never grows a history.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [mirror.json, tools/mirror_feeds.py, .github/workflows/mirror-feeds.yml]

permissions:
  contents: write

concurrency:
  group: mirror-feeds
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore the previous mirror
        run: |
          mkdir -p out
          if git fetch --depth=1 origin mirror; then
            git archive FETCH_HEAD | tar -x -C out
          fi

      - name: Fetch feeds
        run: python3 tools/mirror_feeds.py mirror.json out

      - name: Publish
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "mirror $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mirror
